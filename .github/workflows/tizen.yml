name: Samsung TV

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tizen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install validation dependency
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify sources and behavior
        run: npm run check && npm test
      - name: Build unsigned staging widget
        run: node tools/build.js "$RUNNER_TEMP/tuner-samsung"
      - uses: actions/upload-artifact@v7
        with:
          name: tuner-samsung-unsigned-staging
          path: ${{ runner.temp }}/tuner-samsung/*UNSIGNED.wgt
          if-no-files-found: error
          retention-days: 14
