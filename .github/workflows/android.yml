name: Android

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --console=plain
      - name: Save build and verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tuner-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/screens/*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14
